# Reverse-proxy TEMPLATE. Replace example.org hosts, upstream addresses and TLS paths per
# environment. Not used by the local dev setup. No certificates or keys belong in this repo.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  client_max_body_size 1m;   # raise only on specific upload routes when evidence upload exists

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

  upstream web_upstream   { server web:3000; }
  upstream admin_upstream { server admin:3001; }
  upstream api_upstream   { server api:4000; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Redirect all plain HTTP to HTTPS.
  server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
  }

  # ---- Public website ----
  server {
    listen 443 ssl;
    http2 on;
    server_name www.example.org;
    # ssl_certificate     /etc/nginx/tls/fullchain.pem;   # mounted at deploy time
    # ssl_certificate_key /etc/nginx/tls/privkey.pem;     # mounted at deploy time
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      proxy_pass http://web_upstream;
      include /etc/nginx/proxy_params.conf;
    }
  }

  # ---- API ----
  server {
    listen 443 ssl;
    http2 on;
    server_name api.example.org;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://api_upstream;
      include /etc/nginx/proxy_params.conf;
    }
  }

  # ---- Admin (restrict by network until authentication exists) ----
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.org;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # allow 203.0.113.0/24;   # TODO: office/VPN range (documentation range shown)
    # deny all;

    location / {
      proxy_pass http://admin_upstream;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
